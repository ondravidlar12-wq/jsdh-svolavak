workflows:
  ios-automatic-build:
    name: JSDH Svolávač iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Instalace závislostí Flutteru
        script: flutter pub get
      - name: Sestavení iOS bez podpisu
        script: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r app.ipa Payload
          mv app.ipa $CM_BUILD_DIR/app.ipa
    artifacts:
      - "*.ipa"