workflows:
  ios-automatic-build:
    name: JSDH Svolávač iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: CocoaPods install
        script: |
          cd ios
          pod install
          cd ..
      - name: Sestavení iOS bez podpisu
        script: |
          flutter build ios --release --no-codesign --no-pub
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -q app.ipa Payload
          cp app.ipa $CM_BUILD_DIR/app.ipa
    artifacts:
      - app.ipa