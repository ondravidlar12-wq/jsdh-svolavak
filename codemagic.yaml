workflows:
  ios-automatic-build:
    name: JSDH Svolávač iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Instalace závislostí
        script: flutter pub get
      - name: Sestavení iOS balíčku (IPA)
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa